<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Application Tracker</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="page">
    <!-- Header -->
    <header class="header">
      <h1 class="title">Job Application Tracker</h1>

      <section class="dashboard">
        <div class="stat-card">
          <p class="stat-label">Total</p>
          <p class="stat-value" id="totalCount">0</p>
        </div>
        <div class="stat-card">
          <p class="stat-label">Interview</p>
          <p class="stat-value stat-green" id="interviewCount">0</p>
        </div>
        <div class="stat-card">
          <p class="stat-label">Rejected</p>
          <p class="stat-value stat-red" id="rejectedCount">0</p>
        </div>
      </section>
    </header>

    <hr class="divider" />

    <!-- Available Jobs -->
    <section class="jobs">
      <div class="jobs-head">
        <h2 class="section-title">Available Jobs</h2>
        <p class="jobs-count"><span id="activeTabCount">0</span> jobs</p>
      </div>

      <!-- Tabs -->
      <div class="tabs" role="tablist" aria-label="Job Tabs">
        <button class="tab active" data-tab="all" role="tab" aria-selected="true">All</button>
        <button class="tab" data-tab="interview" role="tab" aria-selected="false">Interview</button>
        <button class="tab" data-tab="rejected" role="tab" aria-selected="false">Rejected</button>
      </div>

      <!-- Cards container -->
      <div id="cardsContainer" class="cards"></div>

      <!-- Empty state -->
      <div id="emptyState" class="empty hidden">
        <img class="empty-img" src="jobs.png" alt="No jobs" />
        <h3 class="empty-title">No jobs available</h3>
        <p class="empty-subtitle">Check back soon for new job opportunities</p>
      </div>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
